# Builds the addon zip and publishes a GitHub release when a version tag
# (v3.5, v3.6, ...) is pushed. The tag's message becomes the release notes.
# For a tag that already exists, run it by hand: Actions > Release > Run workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v3.4"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Build zip
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist/KindouseTweaks/media
          cp *.lua *.toc LICENSE README.md dist/KindouseTweaks/
          cp media/* dist/KindouseTweaks/media/
          (cd dist && zip -r "KindouseTweaks-$VERSION.zip" KindouseTweaks)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          # checkout keeps only the commit; fetch the annotated tag for its message
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          cat >> notes.md <<'EOF'

          **Install:** download the zip below and extract it into `World of Warcraft\_forever_\Interface\AddOns`, so you get an `AddOns\KindouseTweaks` folder. Or install it with the CurseForge app.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/KindouseTweaks-$VERSION.zip" \
            --title "Kindouse Tweaks $VERSION" --notes-file notes.md
